name: my_app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # --- Routing ---
  # --- State Management ---
  signals_flutter: ^7.1.0
  signals_hooks: ^7.1.0
  flutter_hooks: ^0.21.3+1

  # --- Dependency Injection ---
  get_it: ^9.2.0
  # --- Network & API ---
  dio: ^5.9.0
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2

  # --- Data & Persistence ---
  shared_preferences: ^2.5.3
  # isar_community: ^3.3.0
  # isar_community_flutter_libs: ^3.3.0
  path_provider: 2.1.0

  # --- UI & Assets ---
  # chinese_font_library: ^1.2.0
  # flutter_carousel_widget: ^3.1.0
  flutter_gen: ^5.12.0
  lottie: ^3.3.2
  flutter_svg: ^2.2.3
  # cupertino_icons: ^1.0.8

  # --- Utils & Others ---
  logger: ^2.6.2
  device_info_plus: ^13.2.0
  flutter_dotenv: ^6.0.0
  json_annotation: 4.12.0
  freezed_annotation: ^3.1.0
  auto_route: ^11.1.0
  auto_route_generator: ^10.6.0
  drift: 2.34.1
  sqlite3_flutter_libs: 0.5.0
  flex_color_scheme: ^8.4.0
  intl: ^0.20.3
  shimmer: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # --- Code Generation ---
  build_runner: ^2.4.14
  # isar_community_generator: ^3.3.0
  json_serializable: ^6.9.3
  flutter_gen_runner: ^5.12.0
  retrofit_generator: ^10.2.1
  signals_lint: 7.1.0
  freezed: ^4.0.0-dev.3
  drift_dev: 2.34.2+1

# --- Flutter Launcher Icons Plugin ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

# --- Code Generation Settings ---
flutter_gen:
  output: lib/gen/
  line_length: 80

# --- Flutter Specific Settings ---
flutter:
  uses-material-design: true

  # --- Assets Configuration (Uncomment to use) ---
  assets:
    - .env
    - assets/json/lottie-404.json
    - assets/json/lottie-cta.json

  # --- Fonts Configuration (Uncomment to use) ---
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

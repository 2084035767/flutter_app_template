name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source (lib/)
        run: flutter analyze lib/

      - name: Analyze app tests (test/)
        run: flutter analyze test/

      - name: Analyze custom lint rules (packages/my_app_lint/)
        run: dart analyze packages/my_app_lint/lib/

  test:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
